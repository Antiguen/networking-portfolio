<svg width="680" height="320" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Generic 5-node Proxmox cluster architecture</title>
<desc>Illustrates five physical nodes running Proxmox Hypervisor, one deployed via nested virtualization, joined together in a synchronized cluster.</desc>
<style>
  .th { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 700; }
  .ts { font-family: Arial, Helvetica, sans-serif; font-size: 11px; }
</style>
<rect width="680" height="320" fill="#ffffff"/>

<rect x="40" y="40" width="600" height="180" rx="20" fill="#e6f1f7" stroke="#1f7aab" stroke-width="1.5"/>
<text class="th" x="70" y="68" fill="#175f85">Proxmox cluster</text>
<text class="ts" x="70" y="86" fill="#175f85">5 interconnected physical laptops</text>

<rect x="70" y="110" width="100" height="60" rx="10" fill="#cfe6f4" stroke="#1f7aab" stroke-width="1.5"/>
<text class="th" x="120" y="134" text-anchor="middle" fill="#175f85">Node 1</text>
<text class="ts" x="120" y="152" text-anchor="middle" fill="#175f85">Proxmox</text>

<rect x="190" y="110" width="100" height="60" rx="10" fill="#cfe6f4" stroke="#1f7aab" stroke-width="1.5"/>
<text class="th" x="240" y="134" text-anchor="middle" fill="#175f85">Node 2</text>
<text class="ts" x="240" y="152" text-anchor="middle" fill="#175f85">Proxmox</text>

<rect x="310" y="110" width="100" height="60" rx="10" fill="#e9e3fb" stroke="#6c4fd1" stroke-width="2"/>
<text class="th" x="360" y="134" text-anchor="middle" fill="#503a9c">Node 3</text>
<text class="ts" x="360" y="152" text-anchor="middle" fill="#503a9c">Nested virt.</text>

<rect x="430" y="110" width="100" height="60" rx="10" fill="#cfe6f4" stroke="#1f7aab" stroke-width="1.5"/>
<text class="th" x="480" y="134" text-anchor="middle" fill="#175f85">Node 4</text>
<text class="ts" x="480" y="152" text-anchor="middle" fill="#175f85">Proxmox</text>

<rect x="550" y="110" width="70" height="60" rx="10" fill="#cfe6f4" stroke="#1f7aab" stroke-width="1.5"/>
<text class="th" x="585" y="134" text-anchor="middle" fill="#175f85">Node 5</text>
<text class="ts" x="585" y="152" text-anchor="middle" fill="#175f85">Proxmox</text>

<line x1="170" y1="140" x2="190" y2="140" stroke="#1f7aab" stroke-width="1.5"/>
<line x1="290" y1="140" x2="310" y2="140" stroke="#1f7aab" stroke-width="1.5"/>
<line x1="410" y1="140" x2="430" y2="140" stroke="#1f7aab" stroke-width="1.5"/>
<line x1="530" y1="140" x2="550" y2="140" stroke="#1f7aab" stroke-width="1.5"/>

<defs>
  <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#333333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="240" y="240" width="200" height="50" rx="10" fill="#eeeeee" stroke="#888888" stroke-width="1.5"/>
<text class="th" x="340" y="260" text-anchor="middle" fill="#444444">Cluster network</text>
<text class="ts" x="340" y="278" text-anchor="middle" fill="#444444">Synchronization &amp; resource sharing</text>
<line x1="340" y1="220" x2="340" y2="238" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow2)"/>
</svg>
