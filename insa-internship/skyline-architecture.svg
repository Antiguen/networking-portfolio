<svg width="680" height="340" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Generic OpenStack dashboard integration architecture</title>
<desc>Illustrates how a Skyline dashboard authenticates through Keystone identity service within an OpenStack cloud platform, as an alternative to the Horizon interface.</desc>
<style>
  .th { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; }
  .ts { font-family: Arial, Helvetica, sans-serif; font-size: 12px; }
  .lbl { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill: #555; }
</style>
<rect width="680" height="340" fill="#ffffff"/>

<rect x="60" y="40" width="560" height="260" rx="20" fill="#e8f5f1" stroke="#0f8a72" stroke-width="1.5"/>
<text class="th" x="90" y="70" fill="#0f6c58">OpenStack cloud platform</text>

<rect x="100" y="110" width="200" height="90" rx="12" fill="#cfeee8" stroke="#0f8a72" stroke-width="1.5"/>
<text class="th" x="200" y="140" text-anchor="middle" fill="#0f6c58">Keystone</text>
<text class="ts" x="200" y="160" text-anchor="middle" fill="#0f6c58">Identity &amp; auth service</text>

<rect x="380" y="80" width="180" height="70" rx="12" fill="#e9e3fb" stroke="#6c4fd1" stroke-width="1.5"/>
<text class="th" x="470" y="108" text-anchor="middle" fill="#503a9c">Skyline</text>
<text class="ts" x="470" y="126" text-anchor="middle" fill="#503a9c">Modern dashboard</text>

<rect x="380" y="170" width="180" height="70" rx="12" fill="#eeeeee" stroke="#888888" stroke-width="1.5"/>
<text class="th" x="470" y="198" text-anchor="middle" fill="#444444">Horizon</text>
<text class="ts" x="470" y="216" text-anchor="middle" fill="#444444">Legacy dashboard</text>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#333333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<line x1="380" y1="115" x2="302" y2="145" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="380" y1="205" x2="302" y2="165" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="lbl" x="330" y="100" text-anchor="middle">authenticates via</text>

<rect x="240" y="250" width="120" height="40" rx="8" fill="#fde7e0" stroke="#c9694a" stroke-width="1.5"/>
<text class="th" x="300" y="275" text-anchor="middle" fill="#a3492f">Users</text>
<line x1="300" y1="248" x2="300" y2="202" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
